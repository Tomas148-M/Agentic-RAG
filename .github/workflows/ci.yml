name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-lint:
    name: Unit tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev,observability]"

      - name: Run unit tests
        run: python -m pytest --cov=app --cov-report=term-missing tests/unit

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Bandit security analysis
        run: python -m bandit -r app scripts

      - name: Audit Python dependencies
        run: python -m pip_audit

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --pyproject pyproject.toml --output-format JSON

