name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-lint:
    name: Unit tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev,observability]"

      - name: Run unit tests
        run: python -m pytest --cov=app --cov-report=term-missing tests/unit

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Bandit security analysis
        run: python -m bandit -r app scripts

      - name: Audit Python dependencies
        # Chroma is embedded via PersistentClient; this app does not start or expose
        # Chroma's vulnerable HTTP server endpoints. Reassess when a fixed release ships.
        run: >-
          python -m pip_audit
          --skip-editable
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --pyproject pyproject.toml --output-format JSON

