Implement the assigned scope, preserving unrelated user changes. Add meaningful tests and documentation as appropriate. Coordinate file ownership with the parent agent and do not edit files concurrently with review. After review, evaluate and fix actionable findings assigned by the parent. Report changes, checks, and unresolved issues to the parent; do not claim user acceptance.

