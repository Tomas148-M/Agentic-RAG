Keep every application system prompt in a separate, purpose-specific file under app/agents/prompts/. Import or load the prompt from that file; do not embed system prompt text in services, API handlers, graph nodes, adapters, or configuration values. Keep variable user questions and retrieved context separate from system prompt text.
