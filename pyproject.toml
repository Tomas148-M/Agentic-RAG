[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "An agentic retrieval-augmented generation API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "chromadb>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<2.0",
    "pypdf>=5.0,<7.0",
    "pydantic-settings>=2.0,<3.0",
    "sentence-transformers>=3.0,<6.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "ruff>=0.8,<1.0", "typing-extensions>=4.8,<5.0"]
observability = ["arize-phoenix-otel>=0.17,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["ANN201", "ANN202", "D101", "D103"]
